name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build release binaries

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          case "$version" in
            v*.*.*) ;;
            *) echo "Version must look like v0.1.0; got $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: aepbase/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: make install

      - name: Run release checks
        run: make homestead-test

      - name: Build release binaries
        run: make release

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            asset="homestead-${platform}"
            mkdir -p "dist/release/${asset}"
            cp "bin/${asset}" "dist/release/${asset}/homestead"
            chmod +x "dist/release/${asset}/homestead"
            tar -C "dist/release/${asset}" -czf "dist/release/${asset}.tar.gz" homestead
          done
          cd dist/release
          sha256sum homestead-*.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Homestead ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/release/homestead-linux-x64.tar.gz
            dist/release/homestead-linux-arm64.tar.gz
            dist/release/homestead-darwin-x64.tar.gz
            dist/release/homestead-darwin-arm64.tar.gz
            dist/release/SHA256SUMS
